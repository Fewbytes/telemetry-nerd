name: Image

# Builds and pushes the slim (X.Y.Z, X.Y, latest) and full (`analysis` extra, ...-full) images
# for an existing v* tag. Reusable on purpose: release.yml calls it right after creating the tag
# (a tag pushed with GITHUB_TOKEN does not trigger ci.yml), and ci.yml calls it for a tag that was
# pushed by hand. `value:` pins the semver tags to the input because under workflow_call the
# github.ref is the caller's, not the tag.
on:
  workflow_call:
    inputs:
      tag:
        description: Existing git tag to build, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/fewbytes/telemetry-nerd
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Tag must match pyproject version
        run: python3 scripts/check_version.py "$TAG"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Slim variant: X.Y.Z, X.Y, latest.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=slim
          cache-to: type=gha,mode=max,scope=slim
      # Full variant (analysis extra: scipy, statsmodels, scikit-learn, ...): X.Y.Z-full,
      # X.Y-full, latest-full. Same buildx builder; the ui/build-stage layers are shared.
      - id: meta-full
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=-full,onlatest=true
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: EXTRAS=analysis
          push: true
          tags: ${{ steps.meta-full.outputs.tags }}
          labels: ${{ steps.meta-full.outputs.labels }}
          cache-from: type=gha,scope=full
          cache-to: type=gha,mode=max,scope=full
