name: CI

# Tests, lint and UI checks run on every push and pull request. The container image is built
# and pushed to GHCR ONLY for version tags, by image.yml (slim + `-full` variants).
#
# Gates: python, ui, e2e (Playwright on the fixture PromQL source) and integration
# (`-m integration`: VictoriaMetrics testcontainers, needs Docker) must all pass. The `network`
# job (`-m network`: public-internet sources) retries once and never blocks (continue-on-error).
#
# Releases: do NOT push v* tags by hand. Run the Release workflow (release.yml), which calls
# this workflow as a reusable one (workflow_call), and only tags + publishes when it is green.
# The `image` job below is the safety net for a tag that was pushed anyway: it still needs every
# gate, so a stray tag cannot publish an untested image.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_call:
    inputs:
      sha:
        description: Commit to test (release.yml passes the commit it will tag)
        type: string
        default: ""
      network:
        description: Run the non-blocking public-network job
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # github.workflow is the CALLER's name under workflow_call, so a release run never shares a
  # group with (and cancels) the push run on the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag upstream
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: Lint (ruff check + format check)
        run: uv run ruff check . && uv run ruff format --check .
      - name: Release metadata in sync
        run: python3 scripts/check_version.py
      - name: Tests (integration and network excluded via pytest addopts)
        run: uv run pytest

  ui:
    name: UI tests and type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Unit tests (vitest)
        run: npm test
      - name: Type check (svelte-check)
        run: npx svelte-check --tsconfig ./tsconfig.app.json --fail-on-warnings

  e2e:
    name: UI e2e (Playwright on the fixture source)
    # Self-contained (bead y7hb): the daemon reads the in-process fixture PromQL server that
    # playwright.config.ts starts; no VictoriaMetrics, no containers.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag upstream
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: npx playwright test
        working-directory: ui
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: |
            ui/test-results
            ui/playwright-report
          if-no-files-found: ignore

  integration:
    name: Integration tests (VictoriaMetrics containers)
    # Required. testcontainers starts victoriametrics/victoria-metrics on the runner's Docker.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag upstream
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run pytest -m integration

  network:
    name: Public-network tests (non-blocking)
    # Skipped when a caller (release.yml) passes network: false; push/PR runs keep it.
    if: inputs.network != false
    # Hits real public endpoints, so it can fail for reasons outside this repo. It retries once
    # (only the failed tests) and is continue-on-error: it reports, never gates a release.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag upstream
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run pytest -m network || uv run pytest -m network --last-failed

  image:
    name: Publish image (manually pushed version tags only)
    # Normal releases go through release.yml, which calls image.yml itself (tags pushed with
    # GITHUB_TOKEN do not trigger this workflow). This path only fires for a tag pushed by a
    # human or PAT; it is gated on the same checks.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [python, ui, e2e, integration]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ github.ref_name }}
