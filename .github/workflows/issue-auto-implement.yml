name: Issue Auto-Implement

# When nukemberg's own issue gets the "approved" label, have Claude implement it and open
# a PR. Gated on both label name and author so approving someone else's issue, or any other
# label, never triggers an auto-implementation run.
on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: |
      github.event.label.name == 'approved' &&
      github.event.issue.user.login == 'nukemberg'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          branch_prefix: "issue-${{ github.event.issue.number }}/"
          prompt: |
            Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            This issue was opened by nukemberg and approved for implementation. Implement
            it end to end:
            1. Read the issue and the relevant parts of the codebase before changing anything.
            2. Make the code changes on a new branch.
            3. Run the project's lint/test gates for whatever you touched (see CLAUDE.md /
               justfile) and fix failures before proceeding.
            4. Commit, push the branch, and open a PR with `gh pr create` that references
               and closes this issue (`Closes #${{ github.event.issue.number }}`), explaining
               what changed and why.
            5. If the issue is too vague or ambiguous to implement safely, do not guess:
               post a comment explaining what's blocking implementation, remove the
               "approved" label, and add "needs-info" instead of opening a PR.
          claude_args: |
            --allowedTools "Read,Write,Edit,Bash(git:*),Bash(gh pr create:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(just:*),Bash(uv run:*)"
