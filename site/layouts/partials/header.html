<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/">
      <img src="/img/logo.svg" alt="Telemetry Nerd" height="28">
      <span>Telemetry Nerd</span>
    </a>
    <nav>
      {{ range .Site.Menus.main }}
      {{ if eq .Name "GitHub" }}
      <a href="{{ .URL }}" class="icon-link">{{ partial "icon-github.html" $ }}<span>{{ .Name }}</span></a>
      {{ else }}
      <a href="{{ .URL }}">{{ .Name }}</a>
      {{ end }}
      {{ end }}
    </nav>
  </div>
</header>
