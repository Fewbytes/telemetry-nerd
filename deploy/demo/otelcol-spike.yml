# SPIKE config (bead 1h9.3): the same metrics fan out to three backends (docs/superpowers/specs/
# 2026-10-03-demo-pipeline-spike.md). Use: OTELCOL_CONFIG=otelcol-spike.yml just demo-up spike
receivers:
  otlp:
    protocols:
      grpc: {endpoint: "0.0.0.0:4317"}
      http: {endpoint: "0.0.0.0:4318"}
processors:
  memory_limiter: {check_interval: 5s, limit_percentage: 80, spike_limit_percentage: 25}
  batch: {}
connectors:
  spanmetrics: {}
exporters:
  nop: {}
  otlphttp/vm:
    metrics_endpoint: http://victoriametrics:8428/opentelemetry/v1/metrics
  otlphttp/vmprom:
    metrics_endpoint: http://vm-otlp-prom:8428/opentelemetry/v1/metrics
  prometheusremotewrite/vm:
    endpoint: http://vm-rw:8428/api/v1/write
    resource_to_telemetry_conversion: {enabled: true}
service:
  pipelines:
    traces: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [spanmetrics]}
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/vm, otlphttp/vmprom, prometheusremotewrite/vm]
    logs: {receivers: [otlp], processors: [memory_limiter], exporters: [nop]}
