name: overload_spike_completions
description: >
  overload_spike with a COMPLETIONS counter (http_requests_total counts completions, like the
  latency histogram's count): base rho 0.5; rho 1.5 for 60 s (t = 300..360) on every instance; a
  backlog of ~300 requests per instance builds and drains by ~t = 420, and lambda W (from
  completions) and L disagree only in the transient windows.
duration_s: 900
seed: 14
scrape_interval_s: 5
service: checkout
instances: 3
defaults: {lambda: 5.0, mu: 1.0, c: 10, counter: completions, timer: arrival}
faults:
  - kind: overload
    at: 300
    until: 360
    set: {lambda: 15.0}
    expect: {verdict: inconsistent_in_windows, classification: transient}
expect: {verdict: inconsistent_in_windows, classification: transient}
