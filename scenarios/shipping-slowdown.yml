id: shipping-slowdown
description: >-
  intlShippingSlowdown=10sec: international orders wait 10 s in the shipping path; latency (not errors) on checkout PlaceOrder and the frontend checkout request.
timing:
  baseline_s: 300
  cooldown_s: 180
steps:
  - {at: 0, set: {intlShippingSlowdown: "10sec"}}
  - {at: 300, set: {intlShippingSlowdown: "off"}}
faults:
  - {flag: intlShippingSlowdown, variant: "10sec", services: [shipping, checkout]}
ground_truth:
  root_cause_service: shipping
  root_cause_flag: intlShippingSlowdown
  root_cause_summary: >-
    shipping POST /ship-order stalls ~10 s for international orders; checkout PlaceOrder (its caller) inherits the latency; no errors. Observed: shipping /ship-order p90 ~12.7 s, checkout PlaceOrder p90 ~14 s, shipping /get-quote unaffected.
  affected:
    origin: [shipping, checkout]
    propagated: [frontend]
    unaffected_control: [payment, cart, ad]
  tolerance_s: {start: 150, end: 180}
  settle_s: 120
  expected_signals:
      - id: checkout-p90
        service: checkout
        description: 'checkout PlaceOrder p90 latency (ms)'
        metric: traces_span_metrics_duration_milliseconds_bucket
        query: 'histogram_quantile(0.9, sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{service_name="checkout",span_kind="SPAN_KIND_SERVER"}[2m])))'
        direction: up
        min_abs_delta: 2000
      - id: shipping-ship-order-p90
        service: shipping
        description: 'shipping POST /ship-order p90 latency (ms): where the delay is injected'
        metric: traces_span_metrics_duration_milliseconds_bucket
        query: 'histogram_quantile(0.9, sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{service_name="shipping",span_kind="SPAN_KIND_SERVER",span_name="POST /ship-order"}[2m])))'
        direction: up
        min_abs_delta: 2000
      - id: checkout-errors-control
        service: checkout
        description: 'latency, not errors'
        metric: traces_span_metrics_calls_total
        query: 'sum(rate(traces_span_metrics_calls_total{service_name="checkout",status_code="STATUS_CODE_ERROR"}[2m]))'
        direction: flat
        max_abs_delta: 0.05
