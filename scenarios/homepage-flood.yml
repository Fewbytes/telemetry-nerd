id: homepage-flood
description: >-
  loadGeneratorFloodHomepage=on: Locust floods GET /; a load spike (rate up several-fold) on frontend and its dependencies, no errors expected.
timing:
  baseline_s: 300
  cooldown_s: 180
steps:
  - {at: 0, set: {loadGeneratorFloodHomepage: "on"}}
  - {at: 300, set: {loadGeneratorFloodHomepage: "off"}}
faults:
  - {flag: loadGeneratorFloodHomepage, variant: "on", services: [load-generator, frontend]}
ground_truth:
  root_cause_service: load-generator
  root_cause_flag: loadGeneratorFloodHomepage
  root_cause_summary: >-
    Traffic, not a defect: load generator floods the homepage, raising frontend request rate and load on dependencies.
  affected:
    origin: [load-generator, frontend]
    propagated: [product-catalog, currency, cart, ad, recommendation]
    unaffected_control: [payment, checkout]
  tolerance_s: {start: 150, end: 180}
  settle_s: 120
  expected_signals:
      - id: frontend-rate
        service: frontend
        description: 'frontend server request rate'
        metric: traces_span_metrics_calls_total
        query: 'sum(rate(traces_span_metrics_calls_total{service_name="frontend",span_kind="SPAN_KIND_SERVER"}[2m]))'
        direction: up
        min_ratio: 1.8
      - id: product-catalog-rate
        service: product-catalog
        description: 'product-catalog request rate follows'
        metric: traces_span_metrics_calls_total
        query: 'sum(rate(traces_span_metrics_calls_total{service_name="product-catalog",span_kind="SPAN_KIND_SERVER"}[2m]))'
        direction: up
        min_ratio: 1.3
      - id: frontend-eventloop
        service: frontend
        description: 'frontend Node event-loop utilisation (saturation)'
        metric: nodejs_eventloop_utilization_ratio
        query: 'avg(nodejs_eventloop_utilization_ratio{service_name="frontend"})'
        direction: up
        min_ratio: 1.3
      - id: frontend-errors-control
        service: frontend
        description: 'no error cascade expected'
        metric: traces_span_metrics_calls_total
        query: 'sum(rate(traces_span_metrics_calls_total{service_name="frontend",status_code="STATUS_CODE_ERROR"}[2m]))'
        direction: flat
        max_abs_delta: 0.1
