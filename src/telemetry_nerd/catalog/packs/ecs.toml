# Elastic Common Schema (ECS) fields as they appear in an ECS-conformant Elasticsearch/OpenSearch
# index: the subset relevant to RED and Little's-law bindings on a request/access-log index
# (request counting, status/error, duration, service identity).
#
# Naming: Elasticsearch/OpenSearch sources catalog documents by field *path* (dots, not
# underscores: "event.duration", not "event_duration"), so entries here match the ECS dotted
# field path exactly, the way an exporter-specific pack matches a Prometheus metric name exactly.
# Unlike Prometheus naming, there is no reliable name-suffix convention to fall back on for
# arbitrary ES field names (docs/superpowers/specs/2026-10-07-elasticsearch-opensearch-adapter-
# design.md, "Non-goals"): ECS is the convention that makes a field's meaning inferable at all, so
# every claim here is an exact-name entry, never a regex.
#
# Grounding: field shapes and types are ECS's own reference
# (https://www.elastic.co/guide/en/ecs/current/ecs-field-reference.html) cross-checked against
# this project's own ECS-shaped integration fixture (tests/integration/es_seed.py,
# tests/integration/test_es_containers.py), which seeds and queries this exact field set live
# against both Elasticsearch and OpenSearch.

[pack]
name = "ecs"
version = "ecs-9.x"
citation = "https://www.elastic.co/guide/en/ecs/current/ecs-field-reference.html, cross-checked against tests/integration/es_seed.py"

# =============================== Duration (event.duration) ===============================
# ECS declares event.duration in nanoseconds, unscaled (no _seconds/_ms suffix to read the unit
# from, unlike a Prometheus histogram): https://www.elastic.co/guide/en/ecs/current/ecs-event.html.
# Per-document, not pre-bucketed: the source adapter aggregates it with `stats` (mean) or
# `percentiles` (quantiles), not histogram_quantile() -- there is no bucket layout to resolve.
# Catalogued as "histogram" (a per-event duration distribution) so it lines up with the catalog's
# existing latency vocabulary and binding_suggest's histogram-typed rules, even though no
# _bucket/_sum/_count member series exist as they would for a Prometheus histogram.
[[metric]]
name = "event.duration"
type = "histogram"
unit = "ns"
bounds = "≥0"
additivity_series = "additive"
additivity_time = "additive"
role = "latency"
description = "ECS event.duration: time elapsed between an event's start and end, in nanoseconds. Query with \"stats\" (mean) or \"percentiles\" (quantiles), not histogram_quantile()."

# ========================= Status / outcome (errors for RED) =============================
# ECS gives two independent ways to tell a failed request from a successful one: the transport
# status code (http.response.status_code, free-form per protocol) and the ECS-standardized
# event.outcome enum (success | failure | unknown), which holds even for non-HTTP events.
[[metric]]
name = "http.response.status_code"
bounds = "≥0"
role = "errors"
description = "ECS http.response.status_code: the HTTP status of the response. Not a metric to chart directly -- used as a range/terms filter (>=500) to split request counts into errors."

[[metric]]
name = "event.outcome"
role = "errors"
description = "ECS event.outcome: success | failure | unknown, standardized across event types (not HTTP-specific). An alternative error signal to http.response.status_code where the index has no status code field, or for non-HTTP events."

# ===================================== Request identity ===================================
# service.name is ECS's standard join key for request-oriented bindings (the RED/Little's-law
# analog of OTel semconv's service_name label); http.request.method and url.path are common
# grouping/filter dimensions on the same access-log-shaped index, not bindable roles themselves.
[[metric]]
name = "service.name"
role = "info"
description = "ECS service.name: the service the event was generated by. The standard join/group-by key for RED and Little's-law bindings on an ECS index (the ECS analog of OTel semconv's service_name)."

[[metric]]
name = "http.request.method"
role = "info"
description = "ECS http.request.method: the HTTP method of the request (GET, POST, ...). A grouping/filter dimension, not a bindable role."

[[metric]]
name = "url.path"
role = "info"
description = "ECS url.path: the request path. A grouping/filter dimension (e.g. per-route breakdowns), not a bindable role."
