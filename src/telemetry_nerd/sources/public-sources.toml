# Public Prometheus-compatible sources for demos and tests (spike: docs/superpowers/specs/
# 2026-10-01-public-test-sources.md). NOTHING here is connected by default: connect one by
# name with `source_connect(name="grafana-play")` (no url needed).
#
# Politeness (every entry; these are shared services run by third parties):
#   max_concurrency  parallel requests to the source (all entries: 1)
#   min_interval_ms  minimum spacing between request starts (the rate limit: <= 1 req/s)
#   timeout_s        per-request timeout; servers allow ~2 min, broad queries are slow
#   max_range        longest time range to ask for in ONE query (documented ceiling; keep
#                    step so a query stays well under the 11,000 points/series limit)
# Always: descriptive User-Agent (sent by the adapter), interactive volume only, never
# broad scans such as {__name__=~".+"} or count by (__name__), retry on 5xx with backoff.
# Wikimedia's robots.txt is "Disallow: /": interactive use only, never crawl.
#
# backend:  prometheus | thanos | mimir | victoriametrics (what the server really is)
# flavor:   prometheus | victoriametrics (query dialect: only VM gets MetricsQL rollup())
# fixtures: directory under tests/fixtures/ with responses recorded from this source
#           (scripts/record_public_fixtures.py), replayed offline in CI.

[[source]]
name = "grafana-play"
url = "https://play.grafana.org/api/datasources/proxy/uid/grafanacloud-prom"
backend = "mimir"            # Grafana Cloud Metrics (Mimir)
flavor = "prometheus"
resolution_ms = 20000
fixtures = "play"
max_range = "7d"
suggested_use = "Microservices RED without local setup: hosted OpenTelemetry demo (ecommerce-prod/*), banking demo, QuickPizza, k8s, DB exporters; native and classic histograms"
politeness = { max_concurrency = 1, min_interval_ms = 1000, timeout_s = 60 }

