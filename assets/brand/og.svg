<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Telemetry Nerd</title>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 H0 V30" fill="none" stroke="#e1e8e4" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#f3f5f2"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <image href="logo.svg" x="50" y="105" width="420" height="420"/>
  <g font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1b2124">
    <text x="500" y="290" font-size="84" font-weight="700" letter-spacing="-1">Telemetry Nerd</text>
    <text x="504" y="358" font-size="36" fill="#4f5d61">Evidence-first telemetry analysis</text>
    <text x="504" y="406" font-size="36" fill="#4f5d61">for you and your agent</text>
  </g>
  <rect x="504" y="440" width="96" height="6" rx="3" fill="#ffd36b"/>
